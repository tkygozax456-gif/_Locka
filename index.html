<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Locka - الرئيسية</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- الهيدر -->
    <header class="header">

        <img
            src="e5c085fd-15d1-4d6d-a512-0117aad22fb9.jpeg"
            class="logo"
            alt="Locka"
        >

        <button class="menu-button" id="menuButton">☰</button>

        <div class="menu-dropdown" id="menuDropdown">

            <a href="index.html" class="active">
                <span class="menu-icon">🏠</span>
                <span>الرئيسية</span>
            </a>

            <a href="booking-details.html">
                <span class="menu-icon">🔒</span>
                <span>حجوزاتي</span>
            </a>

            <a href="#">
                <span class="menu-icon">🔔</span>
                <span>التنبيهات</span>
            </a>

            <a href="#">
                <span class="menu-icon">🎧</span>
                <span>الدعم والمساعدة</span>
            </a>

            <a href="#">
                <span class="menu-icon">👤</span>
                <span>حسابي</span>
            </a>

        </div>

        <h1>Locka</h1>

    </header>


    <!-- المحتوى -->
    <main class="content">

        <section class="welcome-section">

            <h2>مرحبًا بك في Locka</h2>

            <p>
                احجزي خزانتك بسهولة وأمان
            </p>

        </section>


        <section class="lockers-section">

            <h2>الخزائن المتاحة</h2>


            <div class="locker-card">

                <div class="locker-number">
                    🔒
                </div>

                <div class="locker-info">

                    <h3>الخزانة رقم 1</h3>

                    <p>متاحة للحجز</p>

                    <span class="available">
                        متاحة
                    </span>

                </div>

                <a
                    href="booking-details.html?locker=1"
                    class="book-button"
                >
                    احجز الآن
                </a>

            </div>


            <div class="locker-card">

                <div class="locker-number">
                    🔒
                </div>

                <div class="locker-info">

                    <h3>الخزانة رقم 2</h3>

                    <p>متاحة للحجز</p>

                    <span class="available">
                        متاحة
                    </span>

                </div>

                <a
                    href="booking-details.html?locker=2"
                    class="book-button"
                >
                    احجز الآن
                </a>

            </div>


            <div class="locker-card">

                <div class="locker-number">
                    🔒
                </div>

                <div class="locker-info">

                    <h3>الخزانة رقم 3</h3>

                    <p>متاحة للحجز</p>

                    <span class="available">
                        متاحة
                    </span>

                </div>

                <a
                    href="booking-details.html?locker=3"
                    class="book-button"
                >
                    احجز الآن
                </a>

            </div>


        </section>

    </main>

</div>


<script>

    const menuButton = document.getElementById("menuButton");
    const menuDropdown = document.getElementById("menuDropdown");

    menuButton.addEventListener("click", function () {

        menuDropdown.classList.toggle("open");

    });


    document.addEventListener("click", function (event) {

        if (
            !menuButton.contains(event.target) &&
            !menuDropdown.contains(event.target)
        ) {

            menuDropdown.classList.remove("open");

        }

    });

</script>

</body>

</html>
