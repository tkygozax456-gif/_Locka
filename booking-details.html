<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الحجز - Locka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <!-- الهيدر -->
    <header class="top-bar">
        <img src="logo.png"
             alt="Locka"
             class="logo">
        <button class="menu-button">☰</button>
    </header>
    <!-- القائمة -->
    <nav class="bottom-menu">
        <a href="index.html" class="menu-item active">
            <span class="menu-icon">🏠</span>
            <span>الرئيسية</span>
        </a>
        <a href="booking-details.html" class="menu-item">
            <span class="menu-icon">🔒</span>
            <span>حجوزاتي</span>
        </a>
        <a href="#" class="menu-item">
            <span class="menu-icon">🔔</span>
            <span>التنبيهات</span>
        </a>
        <a href="#" class="menu-item">
            <span class="menu-icon">🎧</span>
            <span>الدعم والمساعدة</span>
        </a>
        <a href="#" class="menu-item">
            <span class="menu-icon">👤</span>
            <span>حسابي</span>
        </a>
    </nav>
    <!-- محتوى الصفحة -->
    <main class="booking-page">
        <a href="index.html" class="back-button">
            ←
        </a>
        <h1>تفاصيل الحجز</h1>
        <div class="locker-icon">
            🔒
        </div>
        <h2>
            الخزانة رقم -
        </h2>
        <section class="booking-card">
            <h3>تفاصيل الحجز</h3>
            <div class="input-group">
                <label for="start-date">
                    تاريخ البداية
                </label>
                <input
                    type="date"
                    id="start-date"
                >
            </div>
            <div class="input-group">
                <label for="start-time">
                    وقت البداية
                </label>
                <input
                    type="time"
                    id="start-time"
                >
            </div>
            <div class="input-group">
                <label for="end-date">
                    تاريخ النهاية
                </label>
                <input
                    type="date"
                    id="end-date"
                >
                <small>
                    أقصى مدة للحجز شهر واحد.
                </small>
            </div>
            <div class="input-group">
                <label for="end-time">
                    وقت النهاية
                </label>
                <input
                    type="time"
                    id="end-time"
                >
            </div>
            <div class="duration">
                <span>مدة الحجز</span>
                <strong>—</strong>
            </div>
            <button class="confirm-button">
                تأكيد الحجز
            </button>
        </section>
        <!-- زر الرجوع للرئيسية -->
        <a href="index.html" class="home-button">
            🏠 العودة للصفحة الرئيسية
        </a>
    </main>
</div>
</body>
</html>
