<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تفاصيل الحجز - Locka</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- الهيدر -->
    <header class="header">

        <img
            src="e5c085fd-15d1-4d6d-a512-0117aad22fb9.jpeg"
            class="logo"
            alt="Locka"
        >

        <button class="menu-button" id="menuButton">☰</button>

        <div class="menu-dropdown" id="menuDropdown">

            <a href="index.html">
                <span class="menu-icon">🏠</span>
                <span>الرئيسية</span>
            </a>

            <a href="booking-details.html" class="active">
                <span class="menu-icon">🔒</span>
                <span>حجوزاتي</span>
            </a>

            <a href="#">
                <span class="menu-icon">🔔</span>
                <span>التنبيهات</span>
            </a>

            <a href="#">
                <span class="menu-icon">🎧</span>
                <span>الدعم والمساعدة</span>
            </a>

            <a href="#">
                <span class="menu-icon">👤</span>
                <span>حسابي</span>
            </a>

        </div>

        <a href="index.html" class="back">
            ‹
        </a>

        <h1>تفاصيل الحجز</h1>

    </header>


    <!-- المحتوى -->
    <main class="content">

        <section class="locker-info-card">

            <div class="locker-big-icon">
                🔒
            </div>

            <div>

                <h2 id="lockerTitle">
                    الخزانة رقم 1
                </h2>

                <p>
                    خزانتك جاهزة للحجز
                </p>

                <span class="available">
                    متاحة
                </span>

            </div>

        </section>


        <section class="booking-form">

            <h2>
                بيانات الحجز
            </h2>


            <label for="bookingDate">
                تاريخ الحجز
            </label>

            <input
                type="date"
                id="bookingDate"
            >


            <label for="startTime">
                وقت بداية الحجز
            </label>

            <input
                type="time"
                id="startTime"
            >


            <label for="endTime">
                وقت نهاية الحجز
            </label>

            <input
                type="time"
                id="endTime"
            >


            <div class="price-card">

                <span>
                    السعر
                </span>

                <strong>
                    10 ريال
                </strong>

            </div>


            <button
                class="main-button"
                id="confirmButton"
            >
                تأكيد الحجز
            </button>


            <a
                href="index.html"
                class="back-home-button"
            >
                العودة للصفحة الرئيسية
            </a>

        </section>

    </main>

</div>


<script>

    const menuButton =
        document.getElementById("menuButton");

    const menuDropdown =
        document.getElementById("menuDropdown");


    menuButton.addEventListener("click", function () {

        menuDropdown.classList.toggle("open");

    });


    document.addEventListener("click", function (event) {

        if (
            !menuButton.contains(event.target) &&
            !menuDropdown.contains(event.target)
        ) {

            menuDropdown.classList.remove("open");

        }

    });


    /* معرفة رقم الخزانة من الرابط */

    const params =
        new URLSearchParams(window.location.search);

    const locker =
        params.get("locker");


    if (locker) {

        document.getElementById("lockerTitle").textContent =
            "الخزانة رقم " + locker;

    }


    /* التاريخ */

    const bookingDate =
        document.getElementById("bookingDate");

    const today =
        new Date().toISOString().split("T")[0];

    bookingDate.min = today;

    bookingDate.value = today;


    /* تأكيد الحجز */

    document
        .getElementById("confirmButton")
        .addEventListener("click", function () {

            const date =
                document.getElementById("bookingDate").value;

            const start =
                document.getElementById("startTime").value;

            const end =
                document.getElementById("endTime").value;


            if (!date || !start || !end) {

                alert("فضلاً أدخلي جميع بيانات الحجز");

                return;

            }


            if (end <= start) {

                alert("وقت النهاية يجب أن يكون بعد وقت البداية");

                return;

            }


            alert("تم تأكيد الحجز بنجاح");

        });

</script>

</body>

</html>
