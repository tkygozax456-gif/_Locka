<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الحجز - Locka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <!-- ================= HEADER ================= -->
    <header class="top-bar">
        <img src="logo.png"
             alt="Locka"
             class="logo">
        <div class="menu-button">
            ☰
        </div>
    </header>
    <!-- ================= PAGE ================= -->
    <main class="booking-page">
        <!-- الرجوع -->
        <a href="https://tkygozax456-gif.github.io/_Locka/"
           class="back-button">
            ←
        </a>
        <h1>تفاصيل الحجز</h1>
        <div class="locker-icon">
            🔒
        </div>
        <h2>الخزانة رقم -</h2>
        <!-- ================= BOOKING CARD ================= -->
        <section class="booking-card">
            <h3>تفاصيل الحجز</h3>
            <div class="input-group">
                <label for="start-date">
                    تاريخ البداية
                </label>
                <input
                    type="date"
                    id="start-date"
                >
            </div>
            <div class="input-group">
                <label for="start-time">
                    وقت البداية
                </label>
                <input
                    type="time"
                    id="start-time"
                >
            </div>
            <div class="input-group">
                <label for="end-date">
                    تاريخ النهاية
                </label>
                <input
                    type="date"
                    id="end-date"
                >
                <small>
                    أقصى مدة للحجز شهر واحد.
                </small>
            </div>
            <div class="input-group">
                <label for="end-time">
                    وقت النهاية
                </label>
                <input
                    type="time"
                    id="end-time"
                >
            </div>
            <div class="duration">
                <span>
                    مدة الحجز
                </span>
                <strong>
                    —
                </strong>
            </div>
            <button class="confirm-button">
                تأكيد الحجز
            </button>
        </section>
        <!-- زر العودة -->
        <a href="https://tkygozax456-gif.github.io/_Locka/"
           class="home-button">
            🏠
            العودة للصفحة الرئيسية
        </a>
    </main>
    <!-- ================= BOTTOM MENU ================= -->
    <nav class="bottom-menu">
        <!-- الرئيسية -->
        <a href="https://tkygozax456-gif.github.io/_Locka/"
           class="menu-item active">
            <span class="menu-icon">
                🏠
            </span>
            <span class="menu-text">
                الرئيسية
            </span>
        </a>
        <!-- حجوزاتي -->
        <a href="https://tkygozax456-gif.github.io/_Locka/booking-details.html"
           class="menu-item">
            <span class="menu-icon">
                🔒
            </span>
            <span class="menu-text">
                حجوزاتي
            </span>
        </a>
        <!-- التنبيهات -->
        <a href="#"
           class="menu-item">
            <span class="menu-icon">
                🔔
            </span>
            <span class="menu-text">
                التنبيهات
            </span>
        </a>
        <!-- الدعم -->
        <a href="#"
           class="menu-item">
            <span class="menu-icon">
                🎧
            </span>
            <span class="menu-text">
                الدعم والمساعدة
            </span>
        </a>
        <!-- الحساب -->
        <a href="#"
           class="menu-item">
            <span class="menu-icon">
                👤
            </span>
            <span class="menu-text">
                حسابي
            </span>
        </a>
    </nav>
</div>
</body>
</html>
